name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Rust tests
        working-directory: control-plane
        run: cargo test --locked
      - name: Rust lint
        working-directory: control-plane
        run: cargo clippy --locked -- -D warnings
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python adapter tests
        working-directory: bridge
        run: |
          pip install httpx==0.28.1 websockets==15.0.1
          python -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Browser JavaScript and shell checks
        run: |
          node --check control-plane/static/app.js
          node --test control-plane/tests/app.test.cjs
          bash -n bridge/start-real.sh
          bash -n bridge/start-ominix-asr.sh
          bash -n bridge/start-ominix-pool.sh
          bash -n bridge/start-ominix-tts.sh
